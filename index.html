<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0d;--card:#151518;--line:#232328;--ink:#f2f2f4;--mute:#8a8a93;--in:#3ddc97;--out:#ff6b6b;--acc:#3ddc97;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;font-weight:600;margin:6px 0 16px}
h2{font-size:14px;font-weight:500;color:var(--mute);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.big{font-size:clamp(32px,10vw,44px);font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hs::-webkit-scrollbar{display:none}
.acc{flex:none;min-width:140px;padding:12px 14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;background:#1e1e22;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute);flex:none}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#222227;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{cursor:pointer;font:inherit}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:var(--bg);font-weight:600;min-height:48px}
.btn.ghost{background:#1e1e22;color:var(--ink)}
.btn.del{background:none;color:var(--out)}
.link{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 0}
input,select{width:100%;background:#1b1b1f;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;min-height:48px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.amt{font-size:34px;font-weight:600;text-align:center;border:0;background:none;padding:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#1b1b1f;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--mute);padding:10px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,13,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:48px}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#04140c;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.panel{background:#111114;width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .22s ease}
.grab{width:40px;height:4px;background:#333;border-radius:4px;margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead button{background:#1b1b1f;border:0;color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.page{display:none}.page.on{display:block}
.ranges{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.ranges input{min-width:0;padding:13px 10px}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.mrow:last-child{border:0}
</style>
</head>
<body>
<main>
<section class="page on" id="p-inicio"></section>
<section class="page" id="p-mov"></section>
<section class="page" id="p-pres"></section>
<section class="page" id="p-calc"></section>
<section class="page" id="p-metas"></section>
<section class="page" id="p-deudas"></section>
</main>

<button class="fab" id="fab" aria-label="Nuevo movimiento">+</button>

<nav id="nav">
<button data-p="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-p="mov"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Movim.</button>
<button data-p="pres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Presup.</button>
<button data-p="calc"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
<button data-p="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>
<button data-p="deudas"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM4 11h16M8 15h3"/></svg>Deudas</button>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
{
const KEY='money-v1';
const CAT_OUT=['Comida','Transporte','CK','Salidas','Gaming / PC','Tienda LUMMEN','Hogar','Salud','Ropa','Suscripciones','Otros'];
const CAT_IN=['Viajes Pachón','Tienda LUMMEN','Regalo','Venta','Otros'];
const COLORS=['#3ddc97','#6ea8ff','#c792ea','#ffcb6b','#ff6b6b','#5ce1e6'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const def={accounts:[{id:'efe',name:'Efectivo',color:COLORS[0],initial:0}],tx:[],budgets:{},goals:[],debts:[]};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||def}catch(e){S=def}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const num=v=>Number(String(v).replace(/[^\d]/g,''))||0;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let month=today().slice(0,7), filt='all', q='';
const mLabel=m=>{const[y,mm]=m.split('-');return MES[mm-1]+' '+y};
const shiftM=(m,d)=>{let[y,mm]=m.split('-').map(Number);mm+=d;if(mm<1){mm=12;y--}if(mm>12){mm=1;y++}return y+'-'+String(mm).padStart(2,'0')};
const accName=id=>(S.accounts.find(a=>a.id===id)||{name:'—'}).name;
function bal(id){const a=S.accounts.find(x=>x.id===id);let b=a?a.initial:0;for(const t of S.tx){if(t.type==='in'&&t.acc===id)b+=t.amt;if(t.type==='out'&&t.acc===id)b-=t.amt;if(t.type==='tr'){if(t.acc===id)b-=t.amt;if(t.to===id)b+=t.amt}}return b}
const total=()=>S.accounts.reduce((s,a)=>s+bal(a.id),0);
const ofMonth=m=>S.tx.filter(t=>t.date.startsWith(m));
function sums(m){let i=0,o=0;for(const t of ofMonth(m)){if(t.type==='in')i+=t.amt;if(t.type==='out')o+=t.amt}return{i,o}}
function byCat(m){const r={};for(const t of ofMonth(m))if(t.type==='out')r[t.cat]=(r[t.cat]||0)+t.amt;return r}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600)}

function txItem(t){
  const sign=t.type==='in'?'+':t.type==='out'?'−':'';
  const cls=t.type==='in'?'in':t.type==='out'?'out':'mute';
  const title=t.desc||(t.type==='tr'?'Transferencia':t.cat);
  const sub=t.type==='tr'?accName(t.acc)+' → '+accName(t.to):t.cat+' · '+accName(t.acc);
  const d=new Date(t.date+'T12:00');
  return `<div class="it" data-tx="${t.id}"><div class="ic">${esc((t.type==='tr'?'⇄':(t.cat||'?')[0]))}</div><div class="grow"><div class="t">${esc(title)}</div><div class="mute t">${esc(sub)} · ${d.getDate()} ${MES[d.getMonth()].slice(0,3)}</div></div><div class="num ${cls}">${sign}${fmt(t.amt)}</div></div>`;
}
const sorted=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));

function rInicio(){
  const {i,o}=sums(month), bc=byCat(month), cats=Object.entries(bc).sort((a,b)=>b[1]-a[1]), max=cats[0]?cats[0][1]:1;
  const rec=sorted(S.tx).slice(0,6);
  $('p-inicio').innerHTML=`
  <div class="mute">Saldo total</div>
  <div class="big num">${fmt(total())}</div>
  <div class="two">
    <div class="card"><div class="mute">Entró en ${MES[+month.slice(5)-1]}</div><div class="num in" style="font-size:20px;font-weight:600">+${fmt(i)}</div></div>
    <div class="card"><div class="mute">Salió en ${MES[+month.slice(5)-1]}</div><div class="num out" style="font-size:20px;font-weight:600">−${fmt(o)}</div></div>
  </div>
  <h2 class="row"><span class="grow">Cuentas</span><button class="link" id="addAcc">+ Cuenta</button></h2>
  <div class="hs">${S.accounts.map(a=>`<div class="card acc" data-acc="${a.id}"><div class="row"><span class="dot" style="background:${esc(a.color)}"></span><span class="mute t">${esc(a.name)}</span></div><div class="num" style="font-size:18px;font-weight:600;margin-top:6px">${fmt(bal(a.id))}</div></div>`).join('')}</div>
  <h2>¿En qué se fue la plata este mes?</h2>
  <div class="card">${cats.length?cats.map(([c,v])=>`<div style="margin:6px 0 12px"><div class="row"><span class="grow t">${esc(c)}</span><span class="num mute">${fmt(v)} · ${Math.round(v/o*100)}%</span></div><div class="bar"><i style="width:${v/max*100}%;background:var(--out)"></i></div></div>`).join(''):'<div class="empty">Aún no hay gastos este mes</div>'}</div>
  <h2 class="row"><span class="grow">Últimos movimientos</span><button class="link" data-go="mov">Ver todos</button></h2>
  <div class="card list">${rec.length?rec.map(txItem).join(''):'<div class="empty">Toca + para registrar tu primer ingreso o gasto</div>'}</div>
  <h2>Respaldo</h2>
  <div class="two"><button class="btn ghost" id="exp">Exportar</button><button class="btn ghost" id="imp">Importar</button></div>
  <p class="mute" style="margin-top:8px">Tus datos se guardan solo en este dispositivo. Exporta un respaldo de vez en cuando.</p>`;
}

function rMov(){
  let l=ofMonth(month);
  if(filt!=='all')l=l.filter(t=>t.type===filt);
  if(q)l=l.filter(t=>(t.desc+' '+t.cat).toLowerCase().includes(q));
  const {i,o}=sums(month);
  $('p-mov').innerHTML=`<h1>Movimientos</h1>
  <div class="mhead"><button id="mPrev" aria-label="Mes anterior">‹</button><b style="text-transform:capitalize">${mLabel(month)}</b><button id="mNext" aria-label="Mes siguiente">›</button></div>
  <div class="two" style="margin:0 0 14px"><div class="card"><div class="mute">Entró</div><div class="num in">+${fmt(i)}</div></div><div class="card"><div class="mute">Salió</div><div class="num out">−${fmt(o)}</div></div></div>
  <input id="q" placeholder="Buscar por nombre o categoría" value="${esc(q)}">
  <div class="chips" style="margin:12px 0">${[['all','Todos'],['in','Ingresos'],['out','Gastos'],['tr','Transferencias']].map(([k,v])=>`<button class="chip ${filt===k?'on':''}" data-f="${k}">${v}</button>`).join('')}</div>
  <div class="card list" id="movList">${l.length?sorted(l).map(txItem).join(''):'<div class="empty">Nada por aquí</div>'}</div>`;
}

function rPres(){
  const bc=byCat(month); const set=Object.entries(S.budgets).filter(([,v])=>v>0);
  const tl=set.reduce((s,[,v])=>s+v,0), tg=set.reduce((s,[c])=>s+(bc[c]||0),0);
  $('p-pres').innerHTML=`<h1>Presupuesto</h1>
  <div class="card"><div class="mute">Te queda este mes</div><div class="big num ${tl-tg<0?'out':''}">${fmt(tl-tg)}</div><div class="mute">Gastado ${fmt(tg)} de ${fmt(tl)}</div><div class="bar"><i style="width:${tl?Math.min(100,tg/tl*100):0}%;background:${tg>tl?'var(--out)':'var(--acc)'}"></i></div></div>
  <h2 class="row"><span class="grow">Por categoría</span><button class="link" id="editB">Editar límites</button></h2>
  <div class="card">${set.length?set.map(([c,v])=>{const g=bc[c]||0,p=g/v*100;return`<div style="margin:6px 0 14px"><div class="row"><span class="grow t">${esc(c)}</span><span class="num ${p>100?'out':'mute'}">${fmt(g)} / ${fmt(v)}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--out)':p>80?'#ffcb6b':'var(--acc)'}"></i></div>${p>100?`<div class="out" style="font-size:12px;margin-top:4px">Te pasaste por ${fmt(g-v)}</div>`:''}</div>`}).join(''):'<div class="empty">Ponle un límite mensual a tus categorías para controlar tus gastos</div>'}</div>`;
}

function rMetas(){
  $('p-metas').innerHTML=`<h1>Metas de ahorro</h1>
  ${S.goals.length?S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return`<div class="card" style="margin-bottom:10px" data-goal="${g.id}"><div class="row"><b class="grow t">${esc(g.name)}</b><span class="mute">${Math.round(p)}%</span></div><div class="num" style="margin-top:6px">${fmt(g.saved)} <span class="mute">de ${fmt(g.target)}</span></div><div class="bar"><i style="width:${p}%"></i></div>${p>=100?'<div class="in" style="font-size:13px;margin-top:6px">¡Meta cumplida!</div>':`<div class="mute" style="margin-top:6px">Faltan ${fmt(g.target-g.saved)}</div>`}</div>`}).join(''):'<div class="card empty">Crea una meta, por ejemplo: la mesa gamer</div>'}
  <button class="btn ghost" id="addGoal" style="margin-top:10px">+ Nueva meta</button>`;
}

function rDeudas(){
  const act=S.debts.filter(d=>!d.paid), me=act.filter(d=>d.dir==='me').reduce((s,d)=>s+d.amt,0), yo=act.filter(d=>d.dir==='yo').reduce((s,d)=>s+d.amt,0);
  const sec=(dir,t)=>{const l=S.debts.filter(d=>d.dir===dir).sort((a,b)=>a.paid-b.paid);return`<h2>${t}</h2><div class="card list">${l.length?l.map(d=>`<div class="it" data-debt="${d.id}" style="${d.paid?'opacity:.45':''}"><div class="ic">${esc(d.person[0]||'?')}</div><div class="grow"><div class="t">${esc(d.person)}</div><div class="mute t">${esc(d.note||'')}${d.paid?' · Pagado':''}</div></div><div class="num ${dir==='me'?'in':'out'}">${fmt(d.amt)}</div></div>`).join(''):'<div class="empty">Nada pendiente</div>'}</div>`};
  $('p-deudas').innerHTML=`<h1>Deudas y préstamos</h1>
  <div class="two" style="margin:0"><div class="card"><div class="mute">Me deben</div><div class="num in" style="font-size:20px;font-weight:600">${fmt(me)}</div></div><div class="card"><div class="mute">Debo</div><div class="num out" style="font-size:20px;font-weight:600">${fmt(yo)}</div></div></div>
  ${sec('me','Me deben')}${sec('yo','Yo debo')}
  <button class="btn ghost" id="addDebt" style="margin-top:14px">+ Nueva deuda</button>`;
}

let cFrom=shiftM(today().slice(0,7),-2), cTo=today().slice(0,7);
function rCalc(){
  let a=cFrom,b=cTo;if(a>b)[a,b]=[b,a];
  const l=S.tx.filter(t=>{const m=t.date.slice(0,7);return m>=a&&m<=b});
  let i=0,o=0;const cat={},mon={};
  for(const t of l){const m=t.date.slice(0,7);mon[m]=mon[m]||{i:0,o:0};if(t.type==='in'){i+=t.amt;mon[m].i+=t.amt}if(t.type==='out'){o+=t.amt;mon[m].o+=t.amt;cat[t.cat]=(cat[t.cat]||0)+t.amt}}
  let n=0;for(let m=a;m<=b;m=shiftM(m,1))n++;
  const cats=Object.entries(cat).sort((x,y)=>y[1]-x[1]),max=cats[0]?cats[0][1]:1;
  const mons=Object.keys(mon).sort().reverse();
  $('p-calc').innerHTML=`<h1>Resumen</h1>
  <p class="mute" style="margin:-8px 0 14px">Todo se suma solo con lo que registras. Elige el rango de meses.</p>
  <div class="ranges"><div><label style="margin-top:0">Desde</label><input type="month" id="cFrom" value="${cFrom}"></div><div><label style="margin-top:0">Hasta</label><input type="month" id="cTo" value="${cTo}"></div></div>
  <div class="chips" style="margin:12px 0">${[['1','Este mes'],['3','3 meses'],['6','6 meses'],['y','Este año'],['all','Todo']].map(([k,v])=>`<button class="chip" data-r="${k}">${v}</button>`).join('')}</div>
  <div class="card"><div class="mute"><span style="text-transform:capitalize">${mLabel(a)}${a!==b?' – '+mLabel(b):''}</span> · ${n} ${n===1?'mes':'meses'}</div>
  <div class="two"><div><div class="mute">Entró</div><div class="num in" style="font-size:20px;font-weight:600">+${fmt(i)}</div></div><div><div class="mute">Salió</div><div class="num out" style="font-size:20px;font-weight:600">−${fmt(o)}</div></div>
  <div><div class="mute">Balance</div><div class="num ${i-o<0?'out':'in'}" style="font-size:20px;font-weight:600">${i-o<0?'−':'+'}${fmt(Math.abs(i-o))}</div></div><div><div class="mute">Gasto promedio / mes</div><div class="num" style="font-size:20px;font-weight:600">${fmt(o/n)}</div></div></div></div>
  <h2>Gastos por categoría</h2>
  <div class="card">${cats.length?cats.map(([c,v])=>`<div style="margin:6px 0 12px"><div class="row"><span class="grow t">${esc(c)}</span><span class="num mute">${fmt(v)} · ${Math.round(v/o*100)}%</span></div><div class="bar"><i style="width:${v/max*100}%;background:var(--out)"></i></div></div>`).join(''):'<div class="empty">Sin gastos en este rango</div>'}</div>
  <h2>Mes por mes</h2>
  <div class="card">${mons.length?mons.map(m=>`<div class="mrow"><span style="text-transform:capitalize">${mLabel(m)}</span><span class="num in">+${fmt(mon[m].i)}</span><span class="num out">−${fmt(mon[m].o)}</span></div>`).join(''):'<div class="empty">Sin movimientos en este rango</div>'}</div>`;
}
let page='inicio';
const R={inicio:rInicio,mov:rMov,pres:rPres,calc:rCalc,metas:rMetas,deudas:rDeudas};
function render(){R[page]()}
function go(p){page=p;document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render();scrollTo(0,0)}

/* Sheets */
const sheet=$('sheet'),panel=$('panel');
function open(html,bind){panel.innerHTML='<div class="grab"></div>'+html;sheet.classList.add('show');bind&&bind();const f=panel.querySelector('[autofocus]');f&&setTimeout(()=>f.focus(),60)}
function close(){sheet.classList.remove('show')}
sheet.addEventListener('click',e=>{if(e.target===sheet)close()});
const opts=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
const accOpts=sel=>S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
function moneyInput(el){el.addEventListener('input',()=>{const n=num(el.value);el.value=n?n.toLocaleString('es-CO'):''})}

function txForm(t){
  const ed=!!t; t=t||{type:'out',amt:'',desc:'',cat:CAT_OUT[0],acc:S.accounts[0]?.id,to:S.accounts[1]?.id,date:today()};
  let type=t.type;
  open(`<div class="seg" id="seg">${[['out','Gasto'],['in','Ingreso'],['tr','Transferir']].map(([k,v])=>`<button data-t="${k}" class="${type===k?'on':''}">${v}</button>`).join('')}</div>
  <input class="amt num" id="fAmt" inputmode="numeric" placeholder="$0" value="${t.amt?t.amt.toLocaleString('es-CO'):''}" autofocus>
  <label>Nombre o descripción</label><input id="fDesc" placeholder="Ej: almuerzo en la U" value="${esc(t.desc)}" maxlength="60">
  <div id="fCatW"><label>Categoría</label><select id="fCat"></select></div>
  <label id="lAcc">Cuenta</label><select id="fAcc">${accOpts(t.acc)}</select>
  <div id="fToW"><label>Hacia</label><select id="fTo">${accOpts(t.to)}</select></div>
  <label>Fecha</label><input type="date" id="fDate" value="${t.date}">
  <button class="btn" id="fSave" style="margin-top:18px">${ed?'Guardar cambios':'Guardar'}</button>
  ${ed?'<button class="btn del" id="fDel">Eliminar</button>':''}`,()=>{
    const setT=k=>{type=k;panel.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
      $('fCatW').style.display=k==='tr'?'none':'';$('fToW').style.display=k==='tr'?'':'none';$('lAcc').textContent=k==='tr'?'Desde':'Cuenta';
      const list=k==='in'?CAT_IN:CAT_OUT;$('fCat').innerHTML=opts(list,list.includes(t.cat)?t.cat:list[0]);$('fAmt').style.color=k==='in'?'var(--in)':k==='out'?'var(--out)':'var(--ink)'};
    setT(type);
    $('seg').onclick=e=>{const b=e.target.closest('button');b&&setT(b.dataset.t)};
    moneyInput($('fAmt'));
    $('fSave').onclick=()=>{
      const amt=num($('fAmt').value);if(!amt)return toast('Escribe un monto');
      if(!S.accounts.length)return toast('Primero crea una cuenta');
      const n={id:t.id||uid(),type,amt,desc:$('fDesc').value.trim(),cat:type==='tr'?'':$('fCat').value,acc:$('fAcc').value,to:type==='tr'?$('fTo').value:'',date:$('fDate').value||today()};
      if(type==='tr'&&n.acc===n.to)return toast('Elige cuentas distintas');
      const i=S.tx.findIndex(x=>x.id===n.id);i>=0?S.tx[i]=n:S.tx.push(n);
      save();close();render();toast(ed?'Actualizado':type==='in'?'Ingreso guardado':type==='out'?'Gasto guardado':'Transferencia hecha');
    };
    if(ed)$('fDel').onclick=()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();close();render();toast('Eliminado')};
  });
}

function accForm(a){
  const ed=!!a;a=a||{name:'',color:COLORS[S.accounts.length%COLORS.length],initial:0};
  open(`<h1>${ed?'Editar cuenta':'Nueva cuenta'}</h1><label>Nombre</label><input id="aN" placeholder="Ej: Daviplata, Bancolombia" value="${esc(a.name)}" autofocus>
  <label>Saldo inicial (lo que tenías al empezar)</label><input id="aI" inputmode="numeric" value="${a.initial?a.initial.toLocaleString('es-CO'):''}" placeholder="$0">
  <label>Color</label><div class="chips" id="aC">${COLORS.map(c=>`<button class="chip ${c===a.color?'on':''}" data-c="${c}" style="width:44px;height:44px;padding:0;background:${c};border-color:${c===a.color?'#fff':c}" aria-label="color"></button>`).join('')}</div>
  <button class="btn" id="aS" style="margin-top:18px">Guardar</button>${ed?'<button class="btn del" id="aD">Eliminar cuenta</button>':''}`,()=>{
    let col=a.color;moneyInput($('aI'));
    $('aC').onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;$('aC').querySelectorAll('button').forEach(x=>x.style.borderColor=x.dataset.c===col?'#fff':x.dataset.c)};
    $('aS').onclick=()=>{const name=$('aN').value.trim();if(!name)return toast('Ponle un nombre');
      if(ed){Object.assign(a,{name,color:col,initial:num($('aI').value)})}else S.accounts.push({id:uid(),name,color:col,initial:num($('aI').value)});
      save();close();render()};
    if(ed)$('aD').onclick=()=>{if(S.tx.some(t=>t.acc===a.id||t.to===a.id))return toast('Tiene movimientos, no se puede borrar');S.accounts=S.accounts.filter(x=>x.id!==a.id);save();close();render()};
  });
}

function budgetForm(){
  open(`<h1>Límites mensuales</h1><p class="mute">Deja vacío lo que no quieras controlar.</p>
  ${CAT_OUT.map((c,i)=>`<label>${esc(c)}</label><input inputmode="numeric" data-b="${i}" placeholder="Sin límite" value="${S.budgets[c]?S.budgets[c].toLocaleString('es-CO'):''}">`).join('')}
  <button class="btn" id="bS" style="margin-top:18px">Guardar</button>`,()=>{
    panel.querySelectorAll('[data-b]').forEach(moneyInput);
    $('bS').onclick=()=>{panel.querySelectorAll('[data-b]').forEach(el=>{const c=CAT_OUT[el.dataset.b],v=num(el.value);if(v)S.budgets[c]=v;else delete S.budgets[c]});save();close();render()};
  });
}

function goalForm(g){
  const ed=!!g;g=g||{name:'',target:0,saved:0};
  open(`<h1>${ed?esc(g.name):'Nueva meta'}</h1>
  ${ed?`<label>Abonar o retirar</label><input id="gA" inputmode="numeric" placeholder="$0"><div class="two"><button class="btn" id="gPlus">Abonar</button><button class="btn ghost" id="gMinus">Retirar</button></div><h2>Editar</h2>`:''}
  <label>Nombre</label><input id="gN" value="${esc(g.name)}" placeholder="Ej: Mesa gamer" ${ed?'':'autofocus'}>
  <label>¿Cuánto necesitas?</label><input id="gT" inputmode="numeric" value="${g.target?g.target.toLocaleString('es-CO'):''}" placeholder="$0">
  <button class="btn ${ed?'ghost':''}" id="gS" style="margin-top:18px">Guardar</button>${ed?'<button class="btn del" id="gD">Eliminar meta</button>':''}`,()=>{
    moneyInput($('gT'));
    $('gS').onclick=()=>{const name=$('gN').value.trim(),target=num($('gT').value);if(!name||!target)return toast('Completa nombre y monto');
      if(ed)Object.assign(g,{name,target});else S.goals.push({id:uid(),name,target,saved:0});save();close();render()};
    if(ed){moneyInput($('gA'));
      const mv=s=>{const v=num($('gA').value);if(!v)return toast('Escribe un monto');g.saved=Math.max(0,g.saved+s*v);save();close();render();toast(s>0?'Abonado':'Retirado')};
      $('gPlus').onclick=()=>mv(1);$('gMinus').onclick=()=>mv(-1);
      $('gD').onclick=()=>{S.goals=S.goals.filter(x=>x.id!==g.id);save();close();render()}}
  });
}

function debtForm(d){
  const ed=!!d;d=d||{person:'',amt:0,dir:'me',note:''};let dir=d.dir;
  open(`<h1>${ed?'Editar deuda':'Nueva deuda'}</h1>
  <div class="seg" id="dSeg" style="grid-template-columns:1fr 1fr"><button data-d="me" class="${dir==='me'?'on':''}">Me deben</button><button data-d="yo" class="${dir==='yo'?'on':''}">Yo debo</button></div>
  <label>Persona</label><input id="dP" value="${esc(d.person)}" placeholder="Nombre" ${ed?'':'autofocus'}>
  <label>Monto</label><input id="dA" inputmode="numeric" value="${d.amt?d.amt.toLocaleString('es-CO'):''}" placeholder="$0">
  <label>Nota</label><input id="dN" value="${esc(d.note)}" placeholder="Ej: le presté para el bus">
  <button class="btn" id="dS" style="margin-top:18px">Guardar</button>
  ${ed?`<button class="btn ghost" id="dPaid" style="margin-top:8px">${d.paid?'Marcar como pendiente':'Marcar como pagada'}</button><button class="btn del" id="dD">Eliminar</button>`:''}`,()=>{
    moneyInput($('dA'));
    $('dSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;dir=b.dataset.d;$('dSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
    $('dS').onclick=()=>{const person=$('dP').value.trim(),amt=num($('dA').value);if(!person||!amt)return toast('Completa persona y monto');
      const n={person,amt,dir,note:$('dN').value.trim()};if(ed)Object.assign(d,n);else S.debts.push({id:uid(),paid:false,...n});save();close();render()};
    if(ed){$('dPaid').onclick=()=>{d.paid=!d.paid;save();close();render()};$('dD').onclick=()=>{S.debts=S.debts.filter(x=>x.id!==d.id);save();close();render()}}
  });
}

function exportData(){
  const txt=JSON.stringify(S);
  try{const b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-respaldo-'+today()+'.json';a.click();toast('Respaldo descargado')}
  catch(e){navigator.clipboard?.writeText(txt).then(()=>toast('Copiado al portapapeles'))}
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0;S={...def,...d};save();render();toast('Datos importados')}catch(e){toast('Archivo no válido')}})};i.click();
}

/* Events */
$('nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.p)};
$('fab').onclick=()=>txForm();
document.querySelector('main').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  const tx=e.target.closest('[data-tx]');if(tx)return txForm(S.tx.find(t=>t.id===tx.dataset.tx));
  const ac=e.target.closest('[data-acc]');if(ac)return accForm(S.accounts.find(a=>a.id===ac.dataset.acc));
  const gl=e.target.closest('[data-goal]');if(gl)return goalForm(S.goals.find(x=>x.id===gl.dataset.goal));
  const db=e.target.closest('[data-debt]');if(db)return debtForm(S.debts.find(x=>x.id===db.dataset.debt));
  const rg=e.target.closest('[data-r]');if(rg){const now=today().slice(0,7),r=rg.dataset.r;cTo=now;
    if(r==='y')cFrom=now.slice(0,4)+'-01';else if(r==='all'){const d=S.tx.map(t=>t.date).sort()[0];cFrom=d?d.slice(0,7):now}else cFrom=shiftM(now,1-Number(r));return rCalc()}
  const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;return rMov()}
  const id=e.target.id;
  if(id==='addAcc')accForm();if(id==='editB')budgetForm();if(id==='addGoal')goalForm();if(id==='addDebt')debtForm();
    if(id==='exp')exportData();if(id==='imp')importData();
  if(id==='mPrev'){month=shiftM(month,-1);rMov()}if(id==='mNext'){month=shiftM(month,1);rMov()}
});
document.querySelector('main').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();const pos=e.target.selectionStart;rMov();const n=$('q');n.focus();n.setSelectionRange(pos,pos)}});
document.querySelector('main').addEventListener('change',e=>{if(e.target.id==='cFrom'&&e.target.value){cFrom=e.target.value;rCalc()}if(e.target.id==='cTo'&&e.target.value){cTo=e.target.value;rCalc()}});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
