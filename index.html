<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;accent-color:#3ddc97;--glass:rgba(255,255,255,.045);--glass-b:rgba(255,255,255,.09);--bg:#0b0b0d;--card:#151518;--line:#232328;--ink:#f2f2f4;--mute:#8a8a93;--in:#3ddc97;--out:#ff6b6b;--acc:#3ddc97;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
/* Se siente como app: al dejar el dedo sobre un texto no sale el menú de copiar/buscar */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;pointer-events:none}
html{background:var(--bg)}
html,body{color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100vh;background:var(--bg)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 45% at 0% 0%,rgba(61,220,151,.16),transparent 70%),radial-gradient(60% 40% at 100% 35%,rgba(110,168,255,.12),transparent 70%),radial-gradient(70% 45% at 40% 100%,rgba(199,146,234,.1),transparent 70%);transform:translateZ(0)}
main{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:22px;font-weight:600;margin:6px 0 16px}
h2{font-size:14px;font-weight:500;color:var(--mute);margin:22px 0 10px}
.card{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);padding:16px}
.big{font-size:clamp(32px,10vw,44px);font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.in{color:var(--in)}.out{color:var(--out)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hs::-webkit-scrollbar{display:none}
.acc{flex:none;min-width:140px;padding:12px 14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
/* Listas largas: el celular solo dibuja las filas que se ven en pantalla */
.list .it{content-visibility:auto;contain-intrinsic-size:auto 63px}
.ic{width:38px;height:38px;border-radius:12px;background:#1e1e22;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute);flex:none}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#222227;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{cursor:pointer;font:inherit}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:var(--bg);font-weight:600;min-height:48px}
.btn.ghost{background:#1e1e22;color:var(--ink)}
.btn.del{background:none;color:var(--out)}
.link{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 0}
input,select{width:100%;background:#1b1b1f;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;min-height:48px}
input,select{transition:border-color .2s,background .2s}
input:focus,select:focus{outline:none;border-color:#3a3a44;background:#202026}
input:focus-visible,select:focus-visible{outline:none}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
.amt,.amt:focus{font-size:40px;font-weight:600;text-align:center;border:0;background:none;padding:6px;min-height:64px;caret-color:currentColor}
.amt::placeholder{color:currentColor;opacity:.35}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#1b1b1f;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--mute);padding:10px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:rgba(22,22,26,.55);border:1px solid rgba(255,255,255,.1);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.45);display:flex;justify-content:space-around;padding:4px;z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:48px}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Hoja que sube desde abajo: el fondo se oscurece suave, se arrastra con el dedo y lo de atrás no se mueve */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;z-index:10;visibility:hidden;transition:background .3s ease,visibility 0s linear .38s;overscroll-behavior:contain;touch-action:none}
.sheet.show{visibility:visible;background:rgba(0,0,0,.6);transition:background .3s ease,visibility 0s}
.panel{background:rgba(20,20,24,.97);will-change:transform;border-top:1px solid rgba(255,255,255,.1);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;transform:translateY(105%);transition:transform .4s cubic-bezier(.22,1,.36,1);box-shadow:none}
.sheet.show .panel{transform:none}
.panel.drag{transition:none}
.grab{width:40px;height:5px;background:#3a3a40;border-radius:5px;margin:0 auto;box-sizing:content-box;padding:6px 40px 14px;background-clip:content-box;cursor:grab;touch-action:none}
@media(prefers-reduced-motion:reduce){.panel,.sheet,.dbox,.page.on,.toast,.fx .foi>*{transition:none!important;animation:none!important}}
.empty{text-align:center;color:var(--mute);padding:28px 0;font-size:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead button{background:#1b1b1f;border:0;color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,40px) scale(.96);background:rgba(242,242,244,.1);border:1px solid rgba(242,242,244,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s,transform .45s cubic-bezier(.2,1.5,.4,1);pointer-events:none;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);animation:toastIn .55s cubic-bezier(.2,1.25,.4,1)}
/* Motion blur leve: llega borroso y se enfoca, como si viniera rápido */
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,46px) scale(.92,1.08);filter:blur(7px)}55%{filter:blur(1px)}100%{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0)}}
.toast.in{background:rgba(61,220,151,.16);border-color:rgba(61,220,151,.5);color:var(--in)}
.toast.tr{background:rgba(110,168,255,.16);border-color:rgba(110,168,255,.5);color:#6ea8ff}
.toast.out{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.5);color:var(--out)}
@media(prefers-reduced-motion:reduce){.toast{transition:opacity .2s}}
.mbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:#1b1b1f;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;min-height:48px;font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.mgrid .chip{padding:14px 0;border-radius:12px;font-size:15px;color:var(--ink)}
.mgrid .chip.on{color:var(--bg)}
.mgrid .chip.now:not(.on){border-color:var(--acc);color:var(--acc)}
.mgrid .chip:disabled{opacity:.25}
.mhead button:disabled{opacity:.25}
/* Selectores propios */
.fxd{display:none!important}
.fx{border:1px solid var(--glass-b);border-radius:14px;background:var(--glass);overflow:hidden;transition:border-color .25s,background .25s}
.fx.open{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07)}
.fld{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:13px 14px;min-height:50px;font-size:16px;text-align:left}
.fld .v{flex:1;display:flex;align-items:center;gap:8px}
.fld .chev{color:var(--mute);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.fx.open .chev{transform:rotate(90deg)}
.fo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1)}
.fx.open .fo{grid-template-rows:1fr}
.foi{overflow:hidden;padding:0 10px}
.fx.open .foi{padding:0 10px 10px}
.fx.open .foi>*{animation:optIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes optIn{from{opacity:0;transform:translateY(-6px);filter:blur(2px)}to{filter:blur(0)}}
.olist{display:grid;gap:2px;max-height:260px;overflow-y:auto;overscroll-behavior:contain}
.opt{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:12px 10px;border-radius:10px;font-size:15px;text-align:left;min-height:44px;transition:background .15s}
.opt .t{flex:1}.opt.on{background:rgba(255,255,255,.08)}.opt:active{background:rgba(255,255,255,.12)}
.ck{color:var(--acc);font-weight:600}
.calh{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.calh button{background:rgba(255,255,255,.06);border:0;color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:16px}
.calh button:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:11px;color:var(--mute);padding:4px 0}
.dd{aspect-ratio:1;border:0;background:none;color:var(--ink);border-radius:50%;font-size:14px;transition:background .15s,transform .15s}
.dd:active{transform:scale(.9)}.dd.now:not(.on){color:var(--acc);font-weight:600}.dd.on{background:var(--ink);color:var(--bg);font-weight:600}.dd:disabled{opacity:.2}
.tbig{text-align:center;font-size:30px;font-weight:600;padding:4px 0 10px}.tbig span{font-size:16px;color:var(--mute);font-weight:500}
.tseg{grid-template-columns:1fr 1fr!important;margin-bottom:4px}
.tlab{font-size:12px;color:var(--mute);margin:12px 2px 8px}
.tg6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tc{border:0;background:rgba(255,255,255,.06);color:var(--ink);border-radius:10px;padding:11px 0;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tc.on{background:var(--ink);color:var(--bg);font-weight:600}
.tfine{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}.tfine .tc{font-size:13px}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tg .chip,.fo .chip{padding:9px 0;text-align:center;font-size:13px;color:var(--ink)}
.fo .row .chip{padding:8px 14px}
.chip.on{color:var(--bg)!important}
.sug{margin-top:8px;gap:6px}.sug .chip{padding:7px 12px;font-size:13px}
/* Vidrio (liquid glass) en lo importante */
nav,.dbox{backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.hero{background:linear-gradient(150deg,rgba(61,220,151,.16),rgba(255,255,255,.04) 55%,rgba(110,168,255,.08))!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 40px rgba(0,0,0,.35)}
.qa button{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025))!important;border:1px solid rgba(255,255,255,.1)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.icb{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.1)!important}
/* El mismo vidrio en todas las secciones: tarjetas, buscador, chips y flechas de mes */
.card{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);contain:layout paint}
.card.warn{background:linear-gradient(160deg,rgba(255,203,107,.14),rgba(255,203,107,.04));border-color:rgba(255,203,107,.28)}
main input,main .mbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
main input:focus{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
main .chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
main .chip.on{background:var(--ink);border-color:var(--ink)}
.mhead button{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.1)!important}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.ic{background:rgba(255,255,255,.07)}
.bar{background:rgba(255,255,255,.08)}
/* Campo que falta: sacudidita y borde rojo suave */
.miss{animation:shake .4s cubic-bezier(.36,.07,.19,.97);border-color:rgba(255,107,107,.6)!important}
.amt.miss{border:0!important}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* Fondo quieto mientras hay un panel abierto (liviano, sin mover la página) */
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none}
/* Modo liviano (gama baja): mismo diseño, sin efectos caros */
.lite body::before{background:linear-gradient(170deg,rgba(61,220,151,.09),transparent 40%,rgba(110,168,255,.05) 80%,transparent)}
.lite nav,.lite .dbox,.lite .toast{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.lite nav{background:rgba(24,24,28,.97)}.lite .dbox{background:#1a1a1e}
.lite .toast{background:#17241e}.lite .toast.out{background:#2a1818}.lite .toast.tr{background:#16202e}.lite .toast:not(.in):not(.out):not(.tr){background:#222226}
.lite .card,.lite .hero,.lite .qa button,.lite .icb{box-shadow:none!important}
.lite .page.on,.lite .fx.open .foi>*,.lite .dlg.show .dbox{animation:none}
.lite .toast.show{animation:toastLite .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes toastLite{from{opacity:0;transform:translate(-50%,30px)}}
.lite .fo{transition-duration:.2s}.lite .panel{transition-duration:.3s}
.ftitle{text-align:center;color:var(--mute);font-size:14px;margin-bottom:2px}
input.main{margin-top:10px;text-align:center;border-color:transparent;background:#1b1b1f}
.more{width:100%;margin-top:12px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--mute);padding:12px 14px;display:flex;gap:10px;font-size:14px;text-align:left;min-height:48px;align-items:center}
.more .t{flex:1;min-width:0}
.page{display:none}.page.on{display:block;animation:fadeIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{filter:blur(0)}}
/* Respuesta al toque, como en apps nativas */
.btn,.chip,.qa button,.icb,.mhead button,.more,.mbtn,.seg button,.card[data-acc],.card[data-goal],.it[data-tx],.it[data-rec],.it[data-debt],button.card{transition:transform .15s ease,background .2s,color .2s,opacity .2s,border-color .2s}
.btn:active,.chip:active,.qa button:active,.icb:active,.mhead button:active,.more:active,.mbtn:active,.seg button:active,button.card:active,.card[data-acc]:active,.card[data-goal]:active{transform:scale(.97)}
.it[data-tx]:active,.it[data-rec]:active,.it[data-debt]:active{opacity:.6}
nav button{transition:color .2s}
nav button svg{transition:transform .2s}
nav button:active svg{transform:scale(.88)}
.bar i{transition:width .5s cubic-bezier(.22,1,.36,1)}
.ranges{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.ranges input{min-width:0;padding:13px 10px}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.mrow:last-child{border:0}
.top{margin:4px 0 14px}
.icb{background:#1b1b1f;border:0;color:var(--mute);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.icb svg,.qa svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(160deg,#17201b 0%,var(--card) 60%);padding:20px 18px}
.after{margin-top:4px;font-size:13px;color:var(--mute)}.after b{color:var(--ink);font-weight:600}
.flow{margin-top:16px;display:grid;gap:8px}
.flow .fr{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;font-size:13px}
.flow .bar{margin:0;height:8px}
.cmp{margin-top:12px;font-size:13px;padding:8px 10px;border-radius:10px;background:#1b1b1f}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qa button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;min-height:48px}
.qa .o svg{color:var(--out)}.qa .i svg{color:var(--in)}.qa .t2 svg{color:#6ea8ff}
.day{font-size:24px;font-weight:600}
.warn{border-color:#4a3c16;background:#1d1a10}
.dlg{align-items:center;justify-content:center;z-index:30;padding:16px}
.dbox{background:rgba(26,26,30,.8);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;width:100%;max-width:360px;transform:scale(.92);opacity:0;transition:transform .3s cubic-bezier(.22,1.3,.36,1),opacity .2s}
.dlg.show .dbox{transform:none;opacity:1;animation:boxIn .32s cubic-bezier(.22,1.3,.36,1)}
@keyframes boxIn{from{filter:blur(4px)}to{filter:blur(0)}}
.dbox p{margin-bottom:16px;line-height:1.5}
.dbox .yes{background:var(--out);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink)}
.chk{justify-content:space-between;flex-direction:row-reverse;padding:12px 14px;border:1px solid var(--glass-b);border-radius:14px;background:var(--glass)}
.chk input{appearance:none;-webkit-appearance:none;width:46px;height:28px;min-height:0;padding:0;border-radius:99px;background:rgba(255,255,255,.14);border:0;position:relative;flex:none;transition:background .25s;cursor:pointer}
.chk input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.22,1.3,.36,1)}
.chk input:checked{background:var(--acc)}
.chk input:checked::after{transform:translateX(18px)}
</style>
</head>
<body>
<main>
<section class="page on" id="p-inicio"></section>
<section class="page" id="p-mov"></section>
<section class="page" id="p-pres"></section>
<section class="page" id="p-calc"></section>
<section class="page" id="p-metas"></section>
<section class="page" id="p-deudas"></section>
</main>


<nav id="nav">
<button data-p="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
<button data-p="mov"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Movim.</button>
<button data-p="pres"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Presup.</button>
<button data-p="calc"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
<button data-p="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>

<script>
{
const KEY='money-v1';
const NF=new Intl.NumberFormat('en-US'),nf=n=>NF.format(n);
/* Modo liviano automático para celulares con poca memoria o pocos núcleos: sin desenfoques, sombras ni brillos */
const LITE=(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||matchMedia('(prefers-reduced-motion: reduce)').matches;
if(LITE)document.documentElement.classList.add('lite');
const CAT_OUT=['Comida','Transporte','CK','Salidas','Gaming / PC','Tienda LUMMEN','Hogar','Salud','Ropa','Suscripciones','Otros'];
const CAT_IN=['Viajes Pachón','Tienda LUMMEN','Regalo','Venta','Otros'];
const NOCAT='Sin categoría';
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const COLORS=['#3ddc97','#6ea8ff','#c792ea','#ffcb6b','#ff6b6b','#5ce1e6'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const def=()=>({accounts:[{id:'efe',name:'Efectivo',color:COLORS[0],initial:0}],tx:[],budgets:{},goals:[],debts:[],recurring:[],lastBackup:0,hide:false});
/* Migración: datos viejos no tenían recurring/lastBackup/hide; se agregan sin tocar lo demás */
const migrate=d=>{const b=def();for(const k in b)if(d[k]===undefined)d[k]=b[k];return d};
let S;
/* Almacenamiento por mes: "money-v2" guarda cuentas/metas/etc y cada mes de movimientos va en su propia llave
   ("money-v2-tx-2026-11"). Así al guardar un gasto solo se reescribe ese mes y no todo el historial.
   La primera vez migra solo desde el formato viejo "money-v1" (que se borra solo cuando lo nuevo quedó guardado). */
const META="money-v2",TXP="money-v2-tx-";
let WROTE={},DIRTY=new Set(),ALL=false,SIZE={};
const touch=(...ds)=>{for(const d of ds)if(d)DIRTY.add(d.slice(0,7))};
function load(){
  const meta=localStorage.getItem(META);
  // Si todavía existe el formato viejo, la migración no terminó: se usa el viejo (que está completo) y se reintenta
  if(meta&&!localStorage.getItem(KEY)){const m=JSON.parse(meta),tx=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(TXP)){const raw=localStorage.getItem(k),a=JSON.parse(raw);SIZE[k]=raw.length;WROTE[k.slice(TXP.length)]=a.length;for(const t of a)tx.push(t)}}
    m.tx=tx;return migrate(m)}
  const old=localStorage.getItem(KEY);
  if(old){const d=migrate(JSON.parse(old));ALL=true;return d}
  return def();
}
try{S=load()}catch(e){try{S=migrate(JSON.parse(localStorage.getItem(KEY))||def())}catch(e2){S=def()}}
/* Guardado: la pantalla responde al instante; los datos se escriben un momento después y siempre antes de cerrar la app */
let VER=0,saveT=0,dirty=false;
function flush(){
  if(!dirty)return;dirty=false;clearTimeout(saveT);
  try{
    const {tx,...meta}=S,ix=idx();
    const mj=JSON.stringify(meta);localStorage.setItem(META,mj);SIZE[META]=mj.length;
    // Red de seguridad: si un mes cambió de tamaño y no quedó marcado, también se guarda
    if(ALL){for(const m of ix.keys())DIRTY.add(m);for(const m in WROTE)DIRTY.add(m)}
    else{for(const[m,a]of ix)if(WROTE[m]!==a.length)DIRTY.add(m);for(const m in WROTE)if(!ix.has(m))DIRTY.add(m)}
    for(const m of DIRTY){const a=ix.get(m);if(a&&a.length){const j=JSON.stringify(a);localStorage.setItem(TXP+m,j);SIZE[TXP+m]=j.length;WROTE[m]=a.length}else{localStorage.removeItem(TXP+m);delete WROTE[m];delete SIZE[TXP+m]}}
    DIRTY.clear();
    if(ALL){ALL=false;localStorage.removeItem(KEY)}
    let used=0;for(const k in SIZE)used+=SIZE[k];
    if(used>4e6&&!flush.warned){flush.warned=true;toast("Parce el espacio se está llenando exporta un respaldo")}
  }catch(e){dirty=true;ALL=true;toast("No se pudo guardar exporta un respaldo")}
}
const save=()=>{BAL=null;IDX=null;VER++;dirty=true;clearTimeout(saveT);saveT=setTimeout(()=>idle(flush),300)};
addEventListener("visibilitychange",()=>{if(document.hidden)flush()});addEventListener("pagehide",flush);
navigator.storage?.persist?.().catch(()=>{});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−$':'$')+nf(Math.abs(Math.round(n)));
const num=v=>Number(String(v).replace(/[^\d]/g,''))||0;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let month=today().slice(0,7), filt='all', q='';
const mLabel=m=>{const[y,mm]=m.split('-');return MES[mm-1]+' '+y};
const shiftM=(m,d)=>{let[y,mm]=m.split('-').map(Number);mm+=d;if(mm<1){mm=12;y--}if(mm>12){mm=1;y++}return y+'-'+String(mm).padStart(2,'0')};
const accName=id=>(S.accounts.find(a=>a.id===id)||{name:'—'}).name;
/* Saldos: se calculan una sola vez y se reusan hasta el próximo guardado */
let BAL=null;
function bal(id){if(!BAL){BAL={};for(const a of S.accounts)BAL[a.id]=a.initial||0;for(const t of S.tx){if(t.type==='in')BAL[t.acc]=(BAL[t.acc]||0)+t.amt;else if(t.type==='out')BAL[t.acc]=(BAL[t.acc]||0)-t.amt;else if(t.type==='tr'){BAL[t.acc]=(BAL[t.acc]||0)-t.amt;BAL[t.to]=(BAL[t.to]||0)+t.amt}}}return BAL[id]||0}
const total=()=>S.accounts.reduce((s,a)=>s+bal(a.id),0);
/* Índice por mes: en vez de recorrer todos los movimientos, va directo al mes que necesita */
let IDX=null,MEMO={v:-1};
function idx(){if(!IDX){IDX=new Map();for(const t of S.tx){const m=t.date.slice(0,7);let a=IDX.get(m);if(!a)IDX.set(m,a=[]);a.push(t)}}return IDX}
const memo=(k,fn)=>{if(MEMO.v!==VER)MEMO={v:VER};return k in MEMO?MEMO[k]:(MEMO[k]=fn())};
const ofMonth=m=>idx().get(m)||[];
const monthsDesc=()=>memo("md",()=>[...idx().keys()].sort().reverse());
/* Los N más recientes sin ordenar todo el historial */
function recent(n){const out=[];for(const m of monthsDesc()){out.push(...sorted(ofMonth(m)));if(out.length>=n)break}return out.slice(0,n)}
function sums(m){return memo('s'+m,()=>{let i=0,o=0;for(const t of ofMonth(m)){if(t.type==='in')i+=t.amt;if(t.type==='out')o+=t.amt}return{i,o}})}
function byCat(m){return memo('c'+m,()=>{const r={};for(const t of ofMonth(m))if(t.type==='out')r[t.cat]=(r[t.cat]||0)+t.amt;return r})}
const pad=n=>String(n).padStart(2,'0');
const dim=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const recDate=(r,m)=>m+'-'+pad(Math.min(r.day,dim(m)));
/* Gastos fijos: crea los movimientos que ya llegaron a su fecha */
function runRec(){
  const td=today(),cm=td.slice(0,7);let ch=false;
  for(const r of S.recurring){let m=shiftM(r.last,1);
    while(m<=cm){const date=recDate(r,m);if(date>td)break;
      S.tx.push({id:uid(),type:r.type,amt:r.amt,desc:r.desc,cat:r.cat,acc:r.acc,to:'',date,rec:r.id});touch(date);r.last=m;ch=true;m=shiftM(m,1)}}
  if(ch)save();return ch;
}
function upcoming(){return S.recurring.map(r=>({r,date:recDate(r,shiftM(r.last,1))})).sort((a,b)=>a.date.localeCompare(b.date))}
const daysTo=d=>Math.round((new Date(d+'T12:00')-new Date(today()+'T12:00'))/864e5);
const whenTxt=d=>{const n=daysTo(d);return n<=0?'hoy':n===1?'mañana':'en '+n+' días'};
function ask(msg,yes,cb){const d=$('dlg');$('dMsg').textContent=msg;$('dYes').textContent=yes||'Eliminar';lockBg();d.classList.add('show');
  const hide=()=>{d.classList.remove('show');setTimeout(unlockBg,0)};
  $('dNo').onclick=hide;d.onclick=e=>{if(e.target===d)hide()};$('dYes').onclick=()=>{hide();cb()}}
/* Aviso que sube desde abajo, transparente y del color del movimiento (verde entra, rojo sale) */
function toast(m,kind){const t=$('toast');t.className='toast';void t.offsetWidth;t.textContent=m;if(kind==='in'||kind==='out'||kind==='tr')t.classList.add(kind);t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}

function txItem(t){
  const sign=t.type==='in'?'+':t.type==='out'?'−':'';
  const cls=t.type==='in'?'in':t.type==='out'?'out':'mute';
  const title=t.desc||(t.type==='tr'?'Transferencia':t.cat);
  const sub=t.type==='tr'?accName(t.acc)+' → '+accName(t.to):t.cat+' · '+accName(t.acc);
  const d=new Date(t.date+'T12:00');
  return `<div class="it" data-tx="${t.id}"><div class="ic">${esc((t.type==='tr'?'⇄':(t.cat||'?')[0]))}</div><div class="grow"><div class="t">${esc(title)}</div><div class="mute t">${esc(sub)} · ${d.getDate()} ${MES[d.getMonth()].slice(0,3)}${hora(t.time)}</div></div><div class="num ${cls}">${sign}${fmt(t.amt)}</div></div>`;
}
const sorted=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.time||'').localeCompare(x.time||'')||y.id.localeCompare(x.id));
const hora=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h<12?'a. m.':'p. m.';h=h%12||12;return' · '+h+':'+String(m).padStart(2,'0')+' '+ap};

/* "Conciencia": aprende de tus propios movimientos (todo se calcula en el celular) */
let SUG=[];
function insights(){
  const td=today(),cm=td.slice(0,7),dn=+td.slice(8),out=[];SUG=[];
  const outs=S.tx.filter(t=>t.type==='out');
  if(outs.length<3)return out;
  const norm=s=>(s||'').trim().toLowerCase();
  // 1) Pagos que se repiten cada mes y aún no son fijos
  const recD=new Set(S.recurring.map(r=>norm(r.desc)));
  const g={};for(const t of outs){const k=norm(t.desc);if(!k||t.rec||recD.has(k))continue;(g[k]=g[k]||[]).push(t)}
  for(const k in g){const l=g[k],ms=new Set(l.map(t=>t.date.slice(0,7)));
    const last3=[shiftM(cm,-2),shiftM(cm,-1),cm].filter(m=>ms.has(m)).length;
    const amts=l.map(t=>t.amt),mx=Math.max(...amts),mn=Math.min(...amts);
    if(last3>=2&&ms.size>=2&&mn>=mx*.8&&l.length<=ms.size+1){const t=sorted(l)[0];SUG.push({type:'out',desc:t.desc,amt:t.amt,cat:t.cat,acc:t.acc,day:+t.date.slice(8)});
      out.push(`<b>${esc(t.desc)}</b> se repite cada mes (${fmt(t.amt)}). ¿Lo vuelvo pago fijo? <button class="link" data-sug="${SUG.length-1}">Sí, agregar</button>`)}}
  // 2) Categoría por encima de tu promedio de los 3 meses anteriores
  const prev=[1,2,3].map(i=>shiftM(cm,-i)),avg={},now=byCat(cm);
  const active=prev.filter(m=>ofMonth(m).some(t=>t.type==='out'));
  if(active.length){for(const m of active)for(const[c,v]of Object.entries(byCat(m)))avg[c]=(avg[c]||0)+v/active.length;
    let best=null;for(const[c,v]of Object.entries(now)){const a=avg[c];if(a&&v>a*1.3&&v-a>20000&&(!best||v-a>best[2]))best=[c,v,v-a]}
    if(best)out.push(`En <b>${esc(best[0])}</b> llevas ${fmt(best[1])} este mes, <span class="out">${Math.round((best[1]/avg[best[0]]-1)*100)}% más</span> que tu promedio.`)}
  // 3) Lo que más repites este mes
  const fr={};for(const t of ofMonth(cm))if(t.type==='out'&&!t.rec){const k=norm(t.desc);if(k)(fr[k]=fr[k]||{n:0,s:0,d:t.desc}),fr[k].n++,fr[k].s+=t.amt}
  const top=Object.values(fr).sort((a,b)=>b.s-a.s)[0];
  if(top&&top.n>=4)out.push(`Este mes has registrado <b>${esc(top.d)}</b> ${top.n} veces: ${fmt(top.s)} en total.`);
  // 4) Día de la semana en que más gastas (con al menos 4 semanas de datos)
  const first=outs.map(t=>t.date).sort()[0];
  if(daysTo(first)<=-28){const DS=['domingos','lunes','martes','miércoles','jueves','viernes','sábados'],w=[0,0,0,0,0,0,0];
    for(const t of outs)if(!t.rec)w[new Date(t.date+'T12:00').getDay()]+=t.amt;
    const tot=w.reduce((a,b)=>a+b,0),mxI=w.indexOf(Math.max(...w));
    if(tot&&w[mxI]/tot>.25)out.push(`Los <b>${DS[mxI]}</b> es cuando más gastas (${Math.round(w[mxI]/tot*100)}% de tus gastos).`)}
  // 5) Proyección del mes
  const o=sums(cm).o;
  if(dn>=5&&o){const proj=o/dn*dim(cm),pm=sums(shiftM(cm,-1)).o;
    out.push(`A este ritmo terminarás el mes gastando unos <b>${fmt(Math.round(proj/1000)*1000)}</b>${pm?` (el mes pasado fueron ${fmt(pm)})`:''}.`)}
  return out.slice(0,3);
}

const rnd=a=>a[Math.floor(Math.random()*a.length)];
let lastMsg="";
function moneyMsg(type,amt,cat){
  let pool=MSG[type];
  if(amt>=1e6&&MSG[type+"Big"])pool=MSG[type+"Big"];
  else{const c=MSG[type+"Cat"]&&MSG[type+"Cat"][cat];if(c&&Math.random()<.6)pool=c;else if(type==="out"&&amt<5000&&Math.random()<.5)pool=MSG.outSmall}
  let m=rnd(pool);if(m===lastMsg&&pool.length>1)m=rnd(pool);lastMsg=m;return m;
}
/* Avisos generales: sin comas y variados */
const OK={

{let sy=null,dy=0,t0=0,dragging=false;

  panel.addEventListener('touchmove',e=>{if(sy===null)return;dy=e.touches[0].clientY-sy;

  const end=()=>{if(sy===null)return;sy=null;if(!dragging)return;dragging=false;panel.classList.remove('drag');

/* Selectores propios: nada de menús del sistema. Cada campo se despliega dentro del panel con el diseño de la app */
const DOW=['D','L','M','M','J','V','S'];
function fx(el,label,build){
  const w=document.createElement('div');w.className='fx';
  w.innerHTML=`<button type="button" class="fld"><span class="v t"></span><span class="chev">›</span></button><div class="fo"><div class="foi"></div></div>`;
  el.after(w);el.classList.add('fxd');
  const v=w.querySelector('.v'),inner=w.querySelector('.foi');
  const api={w,set:(t)=>{v.innerHTML=t},collapse:()=>w.classList.remove('open'),
    refresh(){v.innerHTML=label();w.style.display=el.style.display==='none'?'none':'';if(w.classList.contains('open'))inner.innerHTML=build()}};
  w.querySelector('.fld').onclick=()=>{const was=w.classList.contains('open');panel.querySelectorAll('.fx.open').forEach(x=>x.classList.remove('open'));
    if(!was){inner.innerHTML=build();w.classList.add('open');setTimeout(()=>w.scrollIntoView({block:'nearest',behavior:'smooth'}),180)}};
  new MutationObserver(()=>api.refresh()).observe(el,{attributes:true,childList:true,subtree:true});
  api.refresh();return {api,inner};
}
const fire=(el,ev)=>el.dispatchEvent(new Event(ev||'change',{bubbles:true}));
function fancySelect(sel){
  const dot=val=>{const a=S.accounts.find(x=>x.id===val);return a?`<span class="dot" style="background:${esc(a.color)}"></span>`:''};
  const {api,inner}=fx(sel,()=>{const o=sel.options[sel.selectedIndex];return o?dot(o.value)+esc(o.text):'—'},
    ()=>`<div class="olist">${[...sel.options].filter(o=>!o.selected).map(o=>`<button type="button" class="opt" data-v="${esc(o.value)}">${dot(o.value)}<span class="t">${esc(o.text)}</span>${o.selected?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`);
  inner.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;sel.value=b.dataset.v;fire(sel);api.refresh();api.collapse()};
}
const dLabel=d=>{if(!d)return'—';const n=daysTo(d);if(n===0)return'Hoy';if(n===-1)return'Ayer';const x=new Date(d+'T12:00');const s=x.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});return s[0].toUpperCase()+s.slice(1)};
function fancyDate(inp){
  let vm=(inp.value||today()).slice(0,7);
  const {api,inner}=fx(inp,()=>dLabel(inp.value),()=>{
    const[y,m]=vm.split('-').map(Number),first=new Date(y,m-1,1).getDay(),n=dim(vm),td=today();
    let cells='';for(let i=0;i<first;i++)cells+='<span></span>';
    for(let d=1;d<=n;d++){const ds=vm+'-'+pad(d);cells+=`<button type="button" class="dd ${ds===inp.value?'on':''} ${ds===td?'now':''}" data-d="${ds}" ${ds>td?'disabled':''}>${d}</button>`}
    return`<div class="calh"><button type="button" data-cm="-1">‹</button><b>${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} ${y}</b><button type="button" data-cm="1" ${vm>=td.slice(0,7)?'disabled':''}>›</button></div>
    <div class="cal">${DOW.map(x=>`<span class="dw">${x}</span>`).join('')}${cells}</div>
    <div class="row" style="gap:8px;margin-top:8px"><button type="button" class="chip" data-d="${td}">Hoy</button><button type="button" class="chip" data-d="${shiftD(td,-1)}">Ayer</button></div>`});
  inner.onclick=e=>{const c=e.target.closest('[data-cm]');if(c){vm=shiftM(vm,+c.dataset.cm);api.refresh();return}
    const b=e.target.closest('[data-d]');if(!b||b.disabled)return;inp.value=b.dataset.d;vm=inp.value.slice(0,7);fire(inp);api.refresh();api.collapse()};
}
/* Hora: a. m./p. m. arriba, horas 1-12, minutos de 5 en 5 y ajuste fino de a 1 minuto */
function fancyTime(inp){
  const cur=()=>(inp.value||nowTime()).split(':').map(Number);
  const {api,inner}=fx(inp,()=>inp.value?hora(inp.value).slice(3):'Sin hora',()=>{
    const[h,m]=cur(),pm=h>=12,h12=h%12||12;
    return`<div class="tbig num">${h12}:${pad(m)} <span>${pm?'p. m.':'a. m.'}</span></div>
    <div class="seg tseg"><button type="button" data-ap="am" class="${pm?'':'on'}">a. m.</button><button type="button" data-ap="pm" class="${pm?'on':''}">p. m.</button></div>
    <div class="tlab">Hora</div><div class="tg6">${Array.from({length:12},(_,i)=>i+1).map(x=>`<button type="button" class="tc ${x===h12?'on':''}" data-h="${x}">${x}</button>`).join('')}</div>
    <div class="tlab">Minutos</div><div class="tg6">${Array.from({length:12},(_,i)=>i*5).map(x=>`<button type="button" class="tc ${m===x?'on':''}" data-mi="${x}">:${pad(x)}</button>`).join('')}</div>
    <div class="tfine"><button type="button" class="tc" data-step="-1">− 1 min</button><button type="button" class="tc" data-now>Ahora</button><button type="button" class="tc" data-step="1">+ 1 min</button></div>`});
  inner.onclick=e=>{const b=e.target.closest('button');if(!b)return;let[h,m]=cur();const pm=h>=12;let done=false;
    if(b.dataset.ap){if(b.dataset.ap==='am'&&pm)h-=12;if(b.dataset.ap==='pm'&&!pm)h+=12}
    else if(b.dataset.h){h=(+b.dataset.h%12)+(pm?12:0)}
    else if(b.dataset.mi){m=+b.dataset.mi;done=true}
    else if(b.dataset.step){const t=(h*60+m+(+b.dataset.step)+1440)%1440;h=Math.floor(t/60);m=t%60}
    else if(b.hasAttribute('data-now')){[h,m]=nowTime().split(':').map(Number);done=true}
    inp.value=pad(h)+':'+pad(m);fire(inp);api.refresh();if(done)api.collapse()};
}
function fancyDay(inp){
  const {api,inner}=fx(inp,()=>'Día '+inp.value+' de cada mes',()=>`<div class="cal">${Array.from({length:31},(_,i)=>`<button type="button" class="dd ${+inp.value===i+1?'on':''}" data-day="${i+1}">${i+1}</button>`).join('')}</div>`);
  inner.onclick=e=>{const b=e.target.closest('[data-day]');if(!b)return;inp.value=b.dataset.day;fire(inp);api.refresh();api.collapse()};
}
/* Sugerencias como chips debajo del campo (reemplaza la lista del sistema) */
function fancyList(inp){
  const dl=$(inp.getAttribute('list'));inp.removeAttribute('list');if(!dl)return;
  const all=[...dl.options].map(o=>o.value);const box=document.createElement('div');box.className='chips sug';inp.after(box);
  const draw=()=>{const q=inp.value.trim().toLowerCase();const l=all.filter(c=>!q||c.toLowerCase().includes(q)&&c.toLowerCase()!==q).slice(0,8);
    box.innerHTML=l.map(c=>`<button type="button" class="chip" data-s="${esc(c)}">${esc(c)}</button>`).join('');box.style.display=inp.style.display==='none'||!l.length?'none':''};
  inp.addEventListener('input',draw);new MutationObserver(draw).observe(inp,{attributes:true,attributeFilter:['style']});
  box.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;inp.value=b.dataset.s;fire(inp,'input');draw()};draw();
}
function enhance(root){
  root.querySelectorAll('select').forEach(fancySelect);
  root.querySelectorAll('input[type=date]').forEach(fancyDate);
  root.querySelectorAll('input[type=time]').forEach(fancyTime);
  root.querySelectorAll('input[data-dayof]').forEach(fancyDay);
  root.querySelectorAll('input[list]').forEach(fancyList);
}
const shiftD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
function moneyInput(el){el.addEventListener('input',()=>{const n=num(el.value);el.value=n?nf(n):''})}

/* Todos los formularios siguen el mismo orden: título pequeño → monto grande → texto principal → "Más detalles" → botón */
const amtIn=(id,v,color)=>`<input class="amt num" id="${id}" inputmode="numeric" placeholder="$0" value="${v?nf(v):''}" style="color:${color||'var(--ink)'}">`;
const moreBox=(inner,label,show)=>`<button class="more" id="moreB" style="${show?'display:none':''}"><span class="t">${label||'Más detalles'}</span><span>›</span></button><div id="moreD" style="${show?'':'display:none'}">${inner}</div>`;
const openMore=()=>{if($('moreB')){$('moreB').style.display='none';$('moreD').style.display=''}};
const TYPE_TITLE={out:'Nuevo gasto',in:'Nuevo ingreso',tr:'Transferencia'};
const TYPE_COLOR={out:'var(--out)',in:'var(--in)',tr:'#6ea8ff'};

function txForm(t,pre){
  const ed=!!t, lastAcc=(recent(30).find(x=>x.type!=='tr')||{}).acc;
  t=t||{type:pre||'out',amt:'',desc:'',cat:NOCAT,acc:S.accounts.some(a=>a.id===lastAcc)?lastAcc:S.accounts[0]?.id,to:S.accounts.find(a=>a.id!==lastAcc)?.id,date:today(),time:nowTime()};
  let type=t.type, catSet=ed;
  const d=new Date(t.date+'T12:00');
  const summary=ed?(t.type==='tr'?accName(t.acc)+' → '+accName(t.to):(t.cat||NOCAT)+' · '+accName(t.acc))+' · '+d.getDate()+' '+MES[d.getMonth()].slice(0,3)+hora(t.time):'';
  open(`<div class="ftitle" id="fTitle">${ed?'Editar movimiento':TYPE_TITLE[type]}</div>
  ${amtIn('fAmt',t.amt,TYPE_COLOR[type])}
  <input class="main" id="fDesc" placeholder="¿En qué?" value="${esc(t.desc)}" maxlength="60" enterkeyhint="done">
  ${moreBox(`
  <div class="seg" id="seg" style="margin-top:14px">${[['out','Gasto'],['in','Ingreso'],['tr','Transferir']].map(([k,v])=>`<button data-t="${k}" class="${type===k?'on':''}">${v}</button>`).join('')}</div>
  <div id="fCatW"><label>Categoría</label><select id="fCat"></select><input id="fCatIn" list="inCats" placeholder="¿De dónde salió?" maxlength="40" value="${t.type==='in'&&t.cat!==NOCAT?esc(t.cat):''}"><datalist id="inCats">${inCats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <label id="lAcc">Cuenta</label><select id="fAcc">${accOpts(t.acc)}</select>
  <div id="fToW"><label>Hacia</label><select id="fTo">${accOpts(t.to)}</select></div>
  <label>Fecha</label><input type="date" id="fDate" value="${t.date}"><label>Hora</label><input type="time" id="fTime" value="${t.time||''}">
  ${ed?(t.rec?'<p class="mute" style="margin-top:10px">Se anotó solo porque es un pago fijo.</p>':''):'<label class="chk" id="fRepW"><input type="checkbox" id="fRep">Repetir cada mes (pago fijo)</label>'}`,summary,type==='tr')}
  <button class="btn" id="fSave" style="margin-top:18px">Guardar</button>
  ${ed?'<button class="btn del" id="fDel">Eliminar</button>':''}`,()=>{
    const setT=k=>{type=k;panel.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
      $('fCatW').style.display=k==='tr'?'none':'';$('fToW').style.display=k==='tr'?'':'none';$('lAcc').textContent=k==='tr'?'Desde':'Cuenta';
      if($('fRepW'))$('fRepW').style.display=k==='tr'?'none':'';
      if(!ed)$('fTitle').textContent=TYPE_TITLE[k];
      if(k==='tr')openMore();
      $('fCat').style.display=k==='in'?'none':'';$('fCatIn').style.display=k==='in'?'':'none';
      const list=[NOCAT,...CAT_OUT];$('fCat').innerHTML=opts(list,list.includes(t.cat)?t.cat:NOCAT);$('fAmt').style.color=TYPE_COLOR[k]};
    setT(type);
    $('seg').onclick=e=>{const b=e.target.closest('button');b&&setT(b.dataset.t)};
    $('fCat').onchange=()=>catSet=true;$('fCatIn').oninput=()=>catSet=true;
    
    $('fSave').onclick=()=>{
      const amt=num($('fAmt').value);if(!amt)return need($('fAmt'),'¿Cuánto?');
      if(!S.accounts.length)return toast('Primero crea una cuenta');
      const desc=$('fDesc').value.trim();
      /* Si no eligió categoría, usa la que puso antes para esa misma descripción */
      let cat=type==='tr'?'':type==='in'?($('fCatIn').value.trim()||NOCAT):$('fCat').value;
      if(type!=='tr'&&!catSet&&cat===NOCAT&&desc){const p=catGuess()[type+'|'+desc.toLowerCase()];if(p)cat=p}
      const n={id:t.id||uid(),type,amt,desc,cat,acc:$('fAcc').value,to:type==='tr'?$('fTo').value:'',date:$('fDate').value||today(),time:$('fTime').value||''};
      if(type==='tr'&&n.acc===n.to){openMore();return toast('Elige cuentas distintas')}
      if(t.rec)n.rec=t.rec;
      const rep=!ed&&type!=='tr'&&$('fRep').checked;
      if(rep){const r={id:uid(),type,amt,desc:n.desc,cat:n.cat,acc:n.acc,day:+n.date.slice(8),last:n.date.slice(0,7)};S.recurring.push(r);n.rec=r.id}
      const i=S.tx.findIndex(x=>x.id===n.id);i>=0?S.tx[i]=n:S.tx.push(n);touch(n.date,t.date);
      runRec();save();close();later(render);
      toast(ed?say('edited'):rep?say('rec'):moneyMsg(type,amt,cat)+' '+(type==='in'?'+':type==='out'?'−':'')+fmt(amt),type);
    };
    if(ed)$('fDel').onclick=()=>ask('¿Eliminar este movimiento de '+fmt(t.amt)+'? No se puede deshacer.','Eliminar',()=>{S.tx=S.tx.filter(x=>x.id!==t.id);touch(t.date);save();close();later(render);toast(say('deleted'))});
  });
}

function accForm(a){
  const ed=!!a;a=a||{name:'',color:COLORS[S.accounts.length%COLORS.length],initial:0};
  open(`<div class="ftitle">${ed?'Editar cuenta':'Nueva cuenta'}</div>
  ${amtIn('aI',a.initial)}<p class="mute" style="text-align:center;margin-top:-2px">Lo que tenías al empezar</p>
  <input class="main" id="aN" placeholder="Nequi, Bancolombia…" value="${esc(a.name)}">
  ${moreBox(`<label>Color</label><div class="chips" id="aC">${COLORS.map(c=>`<button class="chip" data-c="${c}" style="width:44px;height:44px;padding:0;background:${c};border-color:${c===a.color?'#fff':c}" aria-label="color"></button>`).join('')}</div>`,ed?'Color':'Más detalles')}
  <button class="btn" id="aS" style="margin-top:18px">Guardar</button>${ed?'<button class="btn del" id="aD">Eliminar cuenta</button>':''}`,()=>{
    let col=a.color;
    $('aC').onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;$('aC').querySelectorAll('button').forEach(x=>x.style.borderColor=x.dataset.c===col?'#fff':x.dataset.c)};
    $('aS').onclick=()=>{const name=$('aN').value.trim();if(!name)return need($('aN'),'¿Cómo se llama la cuenta?');
      if(ed){Object.assign(a,{name,color:col,initial:num($('aI').value)})}else S.accounts.push({id:uid(),name,color:col,initial:num($('aI').value)});
      save();close();later(render);toast(ed?say('edited'):say('acc'))};
    if(ed)$('aD').onclick=()=>{if(S.tx.some(t=>t.acc===a.id||t.to===a.id))return toast('Tiene movimientos no se puede borrar');if(S.recurring.some(r=>r.acc===a.id))return toast('Tiene pagos fijos no se puede borrar');
      ask('¿Eliminar la cuenta "'+a.name+'"?','Eliminar',()=>{S.accounts=S.accounts.filter(x=>x.id!==a.id);save();close();later(render);toast(say('deleted'))})};
  });
}

function budgetForm(){
  open(`<div class="ftitle">Límites del mes</div><p class="mute" style="text-align:center">Deja vacío lo que no quieras controlar</p>
  ${CAT_OUT.map((c,i)=>`<label>${esc(c)}</label><input inputmode="numeric" data-b="${i}" placeholder="Sin límite" value="${S.budgets[c]?nf(S.budgets[c]):''}">`).join('')}
  <button class="btn" id="bS" style="margin-top:18px">Guardar</button>`,()=>{
    $('bS').onclick=()=>{panel.querySelectorAll('[data-b]').forEach(el=>{const c=CAT_OUT[el.dataset.b],v=num(el.value);if(v)S.budgets[c]=v;else delete S.budgets[c]});save();close();later(render);toast(say('saved'))};
  });
}

function goalForm(g){
  const ed=!!g;g=g||{name:'',target:0,saved:0};
  if(!ed)return open(`<div class="ftitle">Nueva meta</div>
  ${amtIn('gT',0,'var(--acc)')}<p class="mute" style="text-align:center;margin-top:-2px">¿Cuánto necesitas?</p>
  <input class="main" id="gN" placeholder="¿Para qué ahorras?" maxlength="40">
  <button class="btn" id="gS" style="margin-top:18px">Crear meta</button>`,()=>{
    $('gS').onclick=()=>{const name=$('gN').value.trim(),target=num($('gT').value);if(!target)return need($('gT'),'¿Cuánto necesitas?');if(!name)return need($('gN'),"¿Pa' qué es?");
      S.goals.push({id:uid(),name,target,saved:0});save();close();later(render);toast(say('goal'))};
  });
  const p=Math.min(100,g.saved/g.target*100);
  open(`<div class="ftitle">${esc(g.name)} · ${fmt(g.saved)} de ${fmt(g.target)}</div>
  ${amtIn('gA',0,'var(--acc)')}<div class="bar" style="margin:0 0 6px"><i style="width:${p}%"></i></div>
  <div class="two" style="margin-top:14px"><button class="btn" id="gPlus">Abonar</button><button class="btn ghost" id="gMinus">Retirar</button></div>
  ${moreBox(`<label>Nombre</label><input id="gN" value="${esc(g.name)}" maxlength="40">
  <label>Meta total</label><input id="gT" inputmode="numeric" value="${nf(g.target)}">
  <button class="btn ghost" id="gS" style="margin-top:14px">Guardar cambios</button>
  <button class="btn del" id="gD">Eliminar meta</button>`,'Editar meta')}`,()=>{
    const mv=s=>{const v=num($('gA').value);if(!v)return need($('gA'),'¿Cuánto?');g.saved=Math.max(0,g.saved+s*v);save();close();later(render);toast((s>0?say('abono')+' +':say('retiro')+' −')+fmt(v),s>0?'in':'out')};
    $('gPlus').onclick=()=>mv(1);$('gMinus').onclick=()=>mv(-1);
    $('gS').onclick=()=>{const name=$('gN').value.trim(),target=num($('gT').value);if(!name)return need($('gN'),'¿Cómo se llama?');if(!target)return need($('gT'),'¿Cuánto es la meta?');Object.assign(g,{name,target});save();close();later(render);toast(say('edited'))};
    $('gD').onclick=()=>ask('¿Eliminar la meta "'+g.name+'"? Se pierde lo que llevas ahorrado en ella.','Eliminar',()=>{S.goals=S.goals.filter(x=>x.id!==g.id);save();close();later(render);toast(say('deleted'))});
  });
}

function debtForm(d){
  const ed=!!d;d=d||{person:'',amt:0,dir:'me',note:''};let dir=d.dir;
  const col=k=>k==='me'?'var(--in)':'var(--out)';
  open(`<div class="ftitle">${ed?'Editar préstamo':'Nuevo préstamo'}</div>
  ${amtIn('dA',d.amt,col(dir))}
  <div class="seg" id="dSeg" style="grid-template-columns:1fr 1fr;margin-top:6px"><button data-d="me" class="${dir==='me'?'on':''}">Me deben</button><button data-d="yo" class="${dir==='yo'?'on':''}">Yo debo</button></div>
  <input class="main" id="dP" value="${esc(d.person)}" placeholder="¿Quién?" maxlength="40">
  ${moreBox(`<label>Nota</label><input id="dN" value="${esc(d.note)}" placeholder="¿Por qué?" maxlength="60">`,d.note?esc(d.note):'Más detalles')}
  <button class="btn" id="dS" style="margin-top:18px">Guardar</button>
  ${ed?`<button class="btn ghost" id="dPaid" style="margin-top:8px">${d.paid?'Marcar como pendiente':'Ya me pagó / ya pagué'}</button><button class="btn del" id="dD">Eliminar</button>`:''}`,()=>{
    $('dSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;dir=b.dataset.d;$('dSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('dA').style.color=col(dir)};
    $('dS').onclick=()=>{const person=$('dP').value.trim(),amt=num($('dA').value);if(!amt)return need($('dA'),'¿Cuánto?');if(!person)return need($('dP'),'¿Quién?');
      const n={person,amt,dir,note:$('dN').value.trim()};if(ed)Object.assign(d,n);else S.debts.push({id:uid(),paid:false,...n});save();close();later(render);toast(ed?say('edited'):say(dir==='me'?'debtMe':'debtYo'))};
    if(ed){$('dPaid').onclick=()=>{d.paid=!d.paid;save();close();later(render);toast(d.paid?say(d.dir==='me'?'paidMe':'paidYo'):'Otra vez pendiente',d.paid&&d.dir==='me'?'in':undefined)};
      $('dD').onclick=()=>ask('¿Eliminar el préstamo con '+d.person+'?','Eliminar',()=>{S.debts=S.debts.filter(x=>x.id!==d.id);save();close();later(render);toast(say('deleted'))})}
  });
}

function recForm(r,pre){
  const ed=!!r;r=r||{type:'out',amt:0,desc:'',cat:'Suscripciones',acc:S.accounts[0]?.id,day:+today().slice(8),...pre};let type=r.type;
  open(`<div class="ftitle">${ed?'Editar pago fijo':'Nuevo pago fijo'}</div>
  ${amtIn('rA',r.amt,TYPE_COLOR[type])}
  <input class="main" id="rN" value="${esc(r.desc)}" placeholder="Spotify, arriendo…" maxlength="60">
  <label>Día del mes en que se cobra</label><input id="rD" type="hidden" data-dayof value="${r.day}">
  ${moreBox(`<div class="seg" id="rSeg" style="grid-template-columns:1fr 1fr;margin-top:14px"><button data-t="out" class="${type==='out'?'on':''}">Gasto</button><button data-t="in" class="${type==='in'?'on':''}">Ingreso</button></div>
  <label>Categoría</label><select id="rC"></select><input id="rCIn" list="rInCats" placeholder="¿De dónde sale?" maxlength="40" value="${r.type==='in'?esc(r.cat||''):''}"><datalist id="rInCats">${inCats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Cuenta</label><select id="rAcc">${accOpts(r.acc)}</select>
  <p class="mute" style="margin-top:8px">Si el mes tiene menos días, se anota el último día.</p>`,ed?(r.type==='in'?'Ingreso':'Gasto')+' · '+esc(r.cat||NOCAT)+' · '+esc(accName(r.acc)):'Más detalles')}
  <button class="btn" id="rS" style="margin-top:18px">Guardar</button>${ed?'<button class="btn del" id="rDel">Eliminar pago fijo</button>':''}`,()=>{
    const setT=k=>{type=k;$('rSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));$('rC').style.display=k==='in'?'none':'';$('rCIn').style.display=k==='in'?'':'none';$('rC').innerHTML=opts(CAT_OUT,CAT_OUT.includes(r.cat)?r.cat:CAT_OUT[0]);$('rA').style.color=TYPE_COLOR[k]};
    setT(type);$('rSeg').onclick=e=>{const b=e.target.closest('button');b&&setT(b.dataset.t)};
    $('rS').onclick=()=>{const desc=$('rN').value.trim(),amt=num($('rA').value),day=Math.min(31,Math.max(1,num($('rD').value)));
      if(!amt)return need($('rA'),'¿Cuánto?');if(!desc)return need($('rN'),'¿Qué pago es?');if(!S.accounts.length)return toast('Primero crea una cuenta');
      const n={type,desc,amt,day,cat:type==='in'?($('rCIn').value.trim()||NOCAT):$('rC').value,acc:$('rAcc').value};
      if(ed)Object.assign(r,n);else{const td=today(),cm=td.slice(0,7);S.recurring.push({id:uid(),...n,last:recDate(n,cm)<td?cm:shiftM(cm,-1)})}
      runRec();save();close();later(render);toast(ed?say('edited'):say('rec'))};
    if(ed)$('rDel').onclick=()=>ask('¿Eliminar el pago fijo "'+r.desc+'"? Los movimientos que ya se anotaron se quedan.','Eliminar',()=>{S.recurring=S.recurring.filter(x=>x.id!==r.id);save();close();later(render);toast(say('deleted'))});
  });
}
function recList(){
  const l=upcoming();
  open(`<div class="ftitle">Pagos fijos · se anotan solos cada mes</div>
  <div class="card list" style="margin-top:12px">${l.length?l.map(u=>`<div class="it" data-rec="${u.r.id}"><div class="ic">${esc(u.r.desc[0]||'?')}</div><div class="grow"><div class="t">${esc(u.r.desc)}</div><div class="mute t">Día ${u.r.day} · próximo ${whenTxt(u.date)}</div></div><div class="num ${u.r.type==='in'?'in':'out'}">${u.r.type==='in'?'+':'−'}${fmt(u.r.amt)}</div></div>`).join(''):'<div class="empty">Aún no tienes pagos fijos</div>'}</div>
  <button class="btn" id="rNew" style="margin-top:14px">+ Nuevo pago fijo</button>`,()=>{
    $('rNew').onclick=()=>recForm();
    panel.querySelectorAll('[data-rec]').forEach(el=>el.onclick=()=>recForm(S.recurring.find(x=>x.id===el.dataset.rec)));
  });
}

function exportData(){
  const txt=JSON.stringify(S);
  try{const b=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-respaldo-'+today()+'.json';a.click();S.lastBackup=Date.now();save();render();toast('Respaldo descargado')}
  catch(e){navigator.clipboard?.writeText(txt).then(()=>{S.lastBackup=Date.now();save();render();toast('Copiado al portapapeles')})}
}
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0}catch(e){return toast('Archivo no válido')}
    ask('Esto reemplaza TODOS tus datos actuales por los del archivo ('+d.tx.length+' movimientos). ¿Seguir?','Reemplazar',()=>{S=migrate(d);ALL=true;runRec();save();render();toast('Datos importados')})})};i.click();
}

/* Events */
$('nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.p)};
document.querySelector('main').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  const tx=e.target.closest('[data-tx]');if(tx)return txForm(S.tx.find(t=>t.id===tx.dataset.tx));
  const ac=e.target.closest('[data-acc]');if(ac)return accForm(S.accounts.find(a=>a.id===ac.dataset.acc));
  const gl=e.target.closest('[data-goal]');if(gl)return goalForm(S.goals.find(x=>x.id===gl.dataset.goal));
  const db=e.target.closest('[data-debt]');if(db)return debtForm(S.debts.find(x=>x.id===db.dataset.debt));
  const rg=e.target.closest('[data-r]');if(rg){const now=today().slice(0,7),r=rg.dataset.r;cTo=now;
    if(r==='y')cFrom=now.slice(0,4)+'-01';else if(r==='all'){const ms=monthsDesc();cFrom=ms.length?ms[ms.length-1]:now}else cFrom=shiftM(now,1-Number(r));return rCalc()}
  const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;return rMov()}
  const mp=e.target.closest('[data-mp]');if(mp)return monthPicker(mp.dataset.mp);
  const sg=e.target.closest('[data-sug]');if(sg)return recForm(null,SUG[sg.dataset.sug]);
  const nw=e.target.closest('[data-new]');if(nw)return txForm(null,nw.dataset.new);
  const rc=e.target.closest('[data-rec]');if(rc)return recForm(S.recurring.find(x=>x.id===rc.dataset.rec));
  if(e.target.closest('#eye')){S.hide=!S.hide;save();return rInicio()}
  if(e.target.closest('#nocat')){q=NOCAT.toLowerCase();filt='all';month=today().slice(0,7);return go('mov')}
  const id=e.target.id;
  if(id==='recList')recList();
  if(id==='addAcc')accForm();if(id==='editB')budgetForm();if(id==='addGoal')goalForm();if(id==='addDebt')debtForm();
    if(id==='exp')exportData();if(id==='imp')importData();
  if(id==='mPrev'){month=shiftM(month,-1);rMov()}if(id==='mNext'){month=shiftM(month,1);rMov()}
});
/* Buscador: espera a que dejes de escribir y solo redibuja la lista (no toda la pantalla) */
let qT;document.querySelector('main').addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(qT);const v=e.target.value.toLowerCase();
  qT=setTimeout(()=>{q=v;const l=movList();$('movList').innerHTML=l.length?sorted(l).map(txItem).join(''):'<div class="empty">Nada por aquí</div>'},140)});
document.querySelector('main').addEventListener('change',e=>{if(e.target.id==='cFrom'&&e.target.value){cFrom=e.target.value;rCalc()}if(e.target.id==='cTo'&&e.target.value){cTo=e.target.value;rCalc()}});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});

/* Es una app, no una página: nada de seleccionar texto ni "Tocar para buscar" de Google (solo en campos de texto) */
const typing=e=>e.target.closest&&e.target.closest('input,textarea');
document.addEventListener('selectstart',e=>{if(!typing(e))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!typing(e))e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&runRec())render()});
runRec();
if(ALL){dirty=true;flush()}
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
